name: Lint

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "precious-*"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  CRATE_NAME: precious
  RUST_BACKTRACE: 1

# There's not much value in running self-check on multiple platforms. Either
# we're lint-clean or not. We do run on each rust target to catch warnings
# coming from clippy in future rust versions.
jobs:
  lint:
    name: Lint self
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - stable
          - beta
          - nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache cargo & target directories
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install toolchain
        # The toolchain goes through the environment rather than straight into the script, so that
        # the matrix value is never interpolated into the shell.
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          set -e
          set -x
          rustup toolchain install "$TOOLCHAIN" \
              --profile minimal \
              --component clippy,rustfmt \
              --no-self-update
          rustup default "$TOOLCHAIN"
      - name: Run cargo install
        run: cargo install --path . --locked
      - name: Install mise
        run: |
          set -e
          set -x
          curl https://mise.run | sh
          mise install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: "Run precious lint --all"
        run: mise exec -- $HOME/.cargo/bin/precious --debug lint --all
