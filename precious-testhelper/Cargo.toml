[package]
name = "precious-testhelper"
authors.workspace = true
description = "A helper library for precious tests - not for external use"
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
version.workspace = true
# This crate only exists to support precious's own tests, so there is no reason to put it on
# crates.io. The dependency on it in [workspace.dependencies] deliberately has no version
# requirement, which is what lets cargo drop it when packaging the crates that dev-depend on it.
publish = false

[dependencies]
anyhow.workspace = true
camino.workspace = true
env_logger.workspace = true
log.workspace = true
mitsein.workspace = true
precious-helpers.workspace = true
pushd.workspace = true
regex.workspace = true
tempfile.workspace = true

[lints]
workspace = true
