[package]
name = "precious"
authors.workspace = true
description = "One code quality tool to rule them all"
documentation = "https://github.com/houseabsolute/precious"
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
version.workspace = true
categories = ["development-tools"]
keywords = ["beautifier", "linter", "pretty-printer", "tidier"]

[[bin]]
name = "precious"
path = "precious/src/main.rs"
doc = false

[dependencies]
log.workspace = true
precious-core.workspace = true

[package.metadata.release]
# Tagging is turned off for every package in release.toml so that a release makes a single
# "v1.2.3" tag instead of one tag per package. This turns it back on for the root package.
tag = true
tag-name = "v{{version}}"

# These replacements live here rather than in release.toml because anything in release.toml is
# applied once per package in the workspace, and Changes.md would only match for the first one.
#
# The order matters. The existing "NEXT" section is stamped with the version and date first, and
# only then is a fresh "NEXT" section inserted for the next round of changes. Doing it the other
# way around would leave two "NEXT" headings for the first search to match.
[[package.metadata.release.pre-release-replacements]]
file = "Changes.md"
search = "## NEXT - TBD"
replace = "## {{version}} - {{date}}"
exactly = 1

[[package.metadata.release.pre-release-replacements]]
file = "Changes.md"
search = "<!-- next-header -->"
replace = "<!-- next-header -->\n\n## NEXT - TBD"
exactly = 1

[lints]
workspace = true

[workspace]
members = ["precious-helpers", "precious-core", "precious-integration", "precious-testhelper"]

[workspace.package]
authors = ["Dave Rolsky <autarch@urth.org>"]
edition = "2021"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/houseabsolute/precious"
version = "0.12.0"

[workspace.dependencies]
anyhow = { version = "1.0.104", default-features = false }
bon = { version = "3.9.3", default-features = false }
camino = { version = "1.2", features = ["serde1"] }
clap = { version = "4.6.4", default-features = false, features = [
    "cargo",
    "derive",
    "std",
    "wrap_help",
] }
comfy-table = { version = "7.2.2", default-features = false }
env_logger = { version = "0.11.11", default-features = false }
fern = { version = ">= 0.5.0, < 0.7.0", default-features = false, features = ["colored"] }
filetime = { version = "0.2.29", default-features = false }
ignore = { version = "0.4.31", default-features = false }
indexmap = { version = "2.14.0", default-features = false, features = ["serde", "std"] }
itertools = { version = "0.15.0", default-features = true }
libc = { version = "0.2.189", default-features = false }
log = { version = "0.4.33", default-features = false }
md5 = { version = "0.8.1", default-features = false }
mitsein = { version = "0.9.0", default-features = false, features = ["itertools", "std"] }
pathdiff = { version = "0.2.3", default-features = false }
precious-core = { version = "0.12.0", path = "./precious-core" }
precious-helpers = { version = "0.12.0", path = "./precious-helpers" }
precious-testhelper = { path = "./precious-testhelper" }
pretty_assertions = { version = "1.4.1", default-features = true }
pushd = { version = "0.0.2", default-features = false }
rayon = { version = "1.12.0", default-features = false }
regex = { version = "1.13.1", default-features = true }
serde = { version = "1.0.229", default-features = true, features = ["derive"] }
serial_test = { version = "3.5.0", default-features = false }
tempfile = { version = "3.27.0", default-features = false }
test-case = { version = "3.3.1", default-features = false }
thiserror = { version = "2.0.19", default-features = true }
toml = { version = "1.1.3", default-features = false, features = [
    "parse",
    "preserve_order",
    "serde",
] }
which = { version = ">= 3.0.0, < 5.0.0", default-features = false }

[workspace.lints.clippy]
fallible_impl_from = "deny"
wildcard_enum_match_arm = "deny"
unneeded_field_pattern = "deny"
fn_params_excessive_bools = "deny"
